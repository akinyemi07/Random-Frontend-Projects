<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The form page</title>
</head>
<body>
    <div class="forms">
        <h1>lets create forms</h1>
        <!-- there are some things necessary to understand when forms are involved  -->
         <!-- forms 
         inputs
         label
         and there are alot of input types -->
         <form action="learning" >

            <label for="username">Enter the username: </label>
            <input type="text" name="username" placeholder="username"  id="username">
            <br><br>

            <label for="name ">Enter your name: </label>
            <input type="text" name="name" placeholder="first name" id="first name">
            <input type="text" name="name" placeholder="last name" id="last name">
            <br><br>

            <label for="email">Kindly enter your email: </label>
            <input type="email" name="email" placeholder="johndoe@gmail.com" id="email">

            <br><br>

            <label for="password"> Enter your password: </label>

            <input type="password" name="password" placeholder="password">

            <br><br><br>


            <p>lets work on radio shall we </p>

            <input type="radio" name="gender" value="male"><label for=""></label>

            <input type="submit" value="submit the freaking form ">

         </form>
    </div>
</body>
