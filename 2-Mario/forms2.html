<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doc</title>
</head>
<body>
    <form action="learning forms">
        <label for="names">full name:</label>
        <input type="text" name="names" id="names" placeholder="first name" required>
        <input type="text" name="names" id="names" placeholder="last name" required>
        <br><br>
        <label for="email">email:</label>
        <input type="email" name="email" id="email" placeholder="johndoe@gmail.com">
        <br><br>
        <label for="phone">phone number:</label>
        <input type="number" name="phone" id="phone" placeholder="+2347012345678" required>
        <br><br>
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" placeholder="username" required>
        <br><br>
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="enter password" required>
        <br><br>

        <!-- using radio -->
         <p>select your gender</p>
         <input type="radio" name="gender" value="male">
         <label for="male">male</label>
         <br>
         <input type="radio" name="gender" value="female">
         <label for="female">female</label>
         <br>
         <input type="radio" name="gender" value="non-binary">
         <label for="non-binary">non-binary</label>

         <br><br>
         <select name="questions" id="dropdown">
            <option value="1">what is the name of the president of nigeria</option>
            <option value="2"> who is the first person on the moon</option>
            <option value="3">who is the first man to drive the vehicle</option>
            <option value="4">what is your favorite part of your body </option>
            <option value="5">what is your favorite part of the body of the opposite gender </option>
         </select>
         <br><br>

         <label for="answer">Answer:</label>
         <br><br>

         <input type="text" id="answer" name="answer" required>


         <br><br>


         <textarea name="comments" id="comments" rows="10" cols="30">your thoughts </textarea>
         
         <input type="submit"> 
         <hr>

    


    </form>
    
</body>
</html>
